<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalendarX Custom</title>
<meta name="description" content="Create custom earnings calendar subscription links.">
<style>
  :root {
    --ivory: #FAF9F5;
    --paper: #FFFFFF;
    --slate: #141413;
    --clay: #D97757;
    --clay-d: #B85C3E;
    --oat: #E3DACC;
    --olive: #788C5D;
    --g100: #F0EEE6;
    --g200: #E6E3DA;
    --g300: #D1CFC5;
    --g500: #87867F;
    --g700: #3D3D3A;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 32px 72px; }
  header {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 40px;
    align-items: end;
    padding-bottom: 30px;
    border-bottom: 1.5px solid var(--g300);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--g500);
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--clay); }
  h1 {
    font-family: var(--serif);
    font-size: clamp(36px, 5vw, 58px);
    font-weight: 500;
    line-height: 1.06;
    letter-spacing: 0;
    margin: 0;
    max-width: 15ch;
  }
  h1 em { color: var(--clay); font-style: italic; }
  .status {
    background: var(--paper);
    border: 1.5px solid var(--g300);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--g700);
  }
  .status b { color: var(--slate); font-weight: 600; }
  .panel {
    background: var(--paper);
    border: 1.5px solid var(--g300);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 26px;
  }
  .panel-head {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 18px 20px 14px;
    border-bottom: 1.5px solid var(--g100);
  }
  .panel-head h2 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0;
  }
  .count {
    margin-left: auto;
    border: 1.5px solid var(--g300);
    border-radius: 999px;
    color: var(--g500);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 11px;
  }
  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    padding: 16px 20px;
    border-bottom: 1.5px solid var(--g100);
  }
  input, textarea {
    width: 100%;
    border: 1.5px solid var(--g300);
    border-radius: 8px;
    background: var(--ivory);
    color: var(--slate);
    font: inherit;
    padding: 12px 13px;
  }
  input:focus, textarea:focus {
    outline: 2px solid rgba(217, 119, 87, .28);
    border-color: var(--clay);
  }
  .quick {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 20px 16px;
    border-bottom: 1.5px solid var(--g100);
  }
  button, .btn {
    border: 1.5px solid var(--g300);
    border-radius: 999px;
    background: transparent;
    color: var(--slate);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    min-height: 38px;
    padding: 8px 14px;
    text-decoration: none;
    white-space: nowrap;
  }
  button:hover, .btn:hover { border-color: var(--slate); }
  button.primary, .btn.primary {
    background: var(--slate);
    border-color: var(--slate);
    color: var(--ivory);
  }
  button.primary:disabled {
    background: var(--g300);
    border-color: var(--g300);
    color: var(--g700);
    cursor: not-allowed;
  }
  .chooser {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr);
    min-height: 520px;
  }
  .available, .picked {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .available { border-right: 1.5px solid var(--g300); }
  .list-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-height: 44px;
    padding: 12px 16px 8px;
    border-bottom: 1.5px solid var(--g100);
  }
  .list-head h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0;
  }
  .list {
    display: grid;
    align-content: start;
    gap: 8px;
    padding: 10px 12px;
    min-height: 360px;
    max-height: 560px;
    overflow: auto;
  }
  .row {
    border: 1.5px solid var(--g200);
    border-radius: 8px;
    padding: 10px 11px;
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
  }
  .row:hover { border-color: var(--g500); }
  .check {
    width: 20px;
    height: 20px;
    accent-color: var(--clay);
  }
  .symbol {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .company {
    color: var(--g700);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .date {
    font-family: var(--mono);
    color: var(--g500);
    font-size: 11px;
    margin-top: 4px;
  }
  .empty {
    color: var(--g500);
    font-size: 13px;
    padding: 18px;
  }
  .pager {
    border-top: 1.5px solid var(--g100);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
  }
  .pager span {
    color: var(--g500);
    font-family: var(--mono);
    font-size: 12px;
    margin-right: auto;
  }
  .picked-list {
    display: grid;
    align-content: start;
    gap: 8px;
    padding: 10px 12px;
    min-height: 360px;
    max-height: 560px;
    overflow: auto;
  }
  .picked-row {
    border: 1.5px solid var(--g200);
    border-radius: 8px;
    padding: 10px 11px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
  }
  .remove {
    min-width: 34px;
    min-height: 34px;
    border-radius: 50%;
    padding: 0;
    color: var(--g500);
  }
  .actions {
    padding: 14px 16px 16px;
    border-top: 1.5px solid var(--g100);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .linkbox {
    padding: 14px 16px 16px;
    border-top: 1.5px solid var(--g100);
    display: grid;
    gap: 10px;
  }
  .linkbox[hidden] { display: none; }
  textarea {
    min-height: 92px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 12px;
  }
  .error { color: var(--clay-d); }
  @media (max-width: 860px) {
    .wrap { padding: 32px 20px 56px; }
    header, .toolbar, .chooser { grid-template-columns: 1fr; }
    .available { border-right: 0; border-bottom: 1.5px solid var(--g300); }
    .list, .picked-list { max-height: 420px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">CalendarX Custom</div>
      <h1>Build a live <em>earnings feed</em></h1>
    </div>
    <div class="status" id="status">Loading current earnings window...</div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>Companies</h2>
      <div class="count" id="result-count">0 results</div>
    </div>
    <div class="toolbar">
      <input id="search" autocomplete="off" placeholder="Search ticker or company" aria-label="Search ticker or company">
      <button id="manual-add" type="button">Add ticker</button>
    </div>
    <div class="quick" id="quick"></div>

    <div class="chooser">
      <section class="available" aria-label="Available companies">
        <div class="list-head">
          <h3>Available</h3>
          <div class="count" id="available-count">0</div>
        </div>
        <div class="list" id="available"></div>
        <div class="pager">
          <span id="page-label">Page 1</span>
          <button id="prev" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </section>

      <section class="picked" aria-label="Selected companies">
        <div class="list-head">
          <h3>Selected</h3>
          <div class="count" id="selected-count">0</div>
        </div>
        <div class="picked-list" id="selected"></div>
        <div class="actions">
          <button class="primary" id="generate" type="button" disabled>Generate link</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <div class="linkbox" id="linkbox" hidden>
          <textarea id="subscribe-url" readonly aria-label="Subscription URL"></textarea>
          <div class="actions">
            <button class="primary" id="copy" type="button">Copy subscription link</button>
            <a class="btn" id="download" href="#">Download .ics</a>
          </div>
        </div>
      </section>
    </div>
  </section>
</main>

<script>
  const STORAGE_KEY = "calendarx.custom.selected.v1";
  const pageSize = 12;
  const state = {
    results: [],
    page: 0,
    selected: new Map(),
    presets: []
  };

  const els = {
    status: document.querySelector("#status"),
    search: document.querySelector("#search"),
    manualAdd: document.querySelector("#manual-add"),
    quick: document.querySelector("#quick"),
    resultCount: document.querySelector("#result-count"),
    availableCount: document.querySelector("#available-count"),
    available: document.querySelector("#available"),
    selectedCount: document.querySelector("#selected-count"),
    selected: document.querySelector("#selected"),
    prev: document.querySelector("#prev"),
    next: document.querySelector("#next"),
    pageLabel: document.querySelector("#page-label"),
    generate: document.querySelector("#generate"),
    clear: document.querySelector("#clear"),
    linkbox: document.querySelector("#linkbox"),
    subscribeUrl: document.querySelector("#subscribe-url"),
    download: document.querySelector("#download"),
    copy: document.querySelector("#copy")
  };

  function esc(value) {
    return String(value || "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function normalizeSymbol(value) {
    return value.trim().toUpperCase().replace(/[^A-Z0-9.-]/g, "");
  }

  function saveSelected() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(state.selected.values())));
  }

  function loadSelected() {
    try {
      const rows = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      for (const row of rows) {
        if (row && row.symbol) state.selected.set(row.symbol, row);
      }
    } catch {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function recordFromSymbol(symbol) {
    symbol = normalizeSymbol(symbol);
    return symbol ? { symbol, companyName: symbol, hasEarnings: false } : null;
  }

  function addRecord(record) {
    if (!record || !record.symbol) return;
    const symbol = normalizeSymbol(record.symbol);
    state.selected.set(symbol, {
      symbol,
      companyName: record.companyName || symbol,
      date: record.date || "",
      time: record.time || "",
      hasEarnings: Boolean(record.hasEarnings)
    });
    els.linkbox.hidden = true;
    saveSelected();
    renderSelected();
    renderAvailable();
  }

  function removeSymbol(symbol) {
    state.selected.delete(symbol);
    els.linkbox.hidden = true;
    saveSelected();
    renderSelected();
    renderAvailable();
  }

  function renderAvailable() {
    const total = state.results.length;
    const pages = Math.max(1, Math.ceil(total / pageSize));
    if (state.page >= pages) state.page = pages - 1;
    const start = state.page * pageSize;
    const rows = state.results.slice(start, start + pageSize);
    els.resultCount.textContent = `${total} results`;
    els.availableCount.textContent = `${total}`;
    els.pageLabel.textContent = `${state.page + 1} / ${pages}`;
    els.prev.disabled = state.page === 0;
    els.next.disabled = state.page >= pages - 1;
    els.available.innerHTML = "";
    if (!rows.length) {
      els.available.innerHTML = `<div class="empty">No matches.</div>`;
      return;
    }
    for (const row of rows) {
      const checked = state.selected.has(row.symbol);
      const item = document.createElement("label");
      item.className = "row";
      item.innerHTML = `
        <input class="check" type="checkbox" ${checked ? "checked" : ""} aria-label="Select ${esc(row.symbol)}">
        <div>
          <div class="symbol">${esc(row.symbol)}</div>
          <div class="company">${esc(row.companyName || row.symbol)}</div>
          <div class="date">${row.hasEarnings ? `${esc(row.date)}${row.time ? " · " + esc(row.time) : ""}` : "No current event in window"}</div>
        </div>
      `;
      item.querySelector("input").addEventListener("change", (event) => {
        if (event.target.checked) addRecord(row);
        else removeSymbol(row.symbol);
      });
      els.available.appendChild(item);
    }
  }

  function renderSelected() {
    const rows = Array.from(state.selected.values()).sort((a, b) => a.symbol.localeCompare(b.symbol));
    els.selectedCount.textContent = `${rows.length}`;
    els.generate.disabled = rows.length === 0;
    els.selected.innerHTML = "";
    if (!rows.length) {
      els.selected.innerHTML = `<div class="empty">No companies selected.</div>`;
      return;
    }
    for (const row of rows) {
      const item = document.createElement("div");
      item.className = "picked-row";
      item.innerHTML = `
        <div>
          <div class="symbol">${esc(row.symbol)}</div>
          <div class="company">${esc(row.companyName || row.symbol)}</div>
          <div class="date">${row.hasEarnings ? `${esc(row.date)}${row.time ? " · " + esc(row.time) : ""}` : "Waiting for next event"}</div>
        </div>
        <button class="remove" type="button" aria-label="Remove ${esc(row.symbol)}">x</button>
      `;
      item.querySelector("button").addEventListener("click", () => removeSymbol(row.symbol));
      els.selected.appendChild(item);
    }
  }

  async function loadSearch(query = "") {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=200`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    state.results = data.results || [];
    state.page = 0;
    if (data.meta) {
      els.status.innerHTML = `<b>${data.meta.anchor}</b> window · ${data.meta.saved || 0} refreshed · ${data.meta.kept || 0} kept`;
    }
    renderAvailable();
  }

  async function loadPresets() {
    const res = await fetch("/api/presets");
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    state.presets = data.presets || [];
    els.quick.innerHTML = "";
    for (const preset of state.presets) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = preset.label;
      button.addEventListener("click", () => {
        for (const symbol of preset.symbols || []) {
          const record = state.results.find((row) => row.symbol === symbol) || recordFromSymbol(symbol);
          addRecord(record);
        }
      });
      els.quick.appendChild(button);
    }
  }

  async function generate() {
    const symbols = Array.from(state.selected.keys()).sort();
    if (!symbols.length) return;
    els.generate.disabled = true;
    els.generate.textContent = "Generating...";
    try {
      const res = await fetch("/api/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbols })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      els.subscribeUrl.value = data.subscribeUrl;
      els.download.href = data.downloadUrl;
      els.linkbox.hidden = false;
    } catch (err) {
      els.subscribeUrl.value = err.message || "Failed to generate link.";
      els.linkbox.hidden = false;
    } finally {
      els.generate.textContent = "Generate link";
      els.generate.disabled = symbols.length === 0;
    }
  }

  let timer = 0;
  els.search.addEventListener("input", () => {
    window.clearTimeout(timer);
    timer = window.setTimeout(() => {
      loadSearch(els.search.value).catch((err) => {
        els.available.innerHTML = `<div class="empty error">${esc(err.message)}</div>`;
      });
    }, 240);
  });
  els.search.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      addRecord(recordFromSymbol(els.search.value));
    }
  });
  els.manualAdd.addEventListener("click", () => addRecord(recordFromSymbol(els.search.value)));
  els.prev.addEventListener("click", () => { state.page -= 1; renderAvailable(); });
  els.next.addEventListener("click", () => { state.page += 1; renderAvailable(); });
  els.generate.addEventListener("click", generate);
  els.clear.addEventListener("click", () => {
    state.selected.clear();
    els.linkbox.hidden = true;
    saveSelected();
    renderSelected();
    renderAvailable();
  });
  els.copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(els.subscribeUrl.value);
    const old = els.copy.textContent;
    els.copy.textContent = "Copied";
    window.setTimeout(() => { els.copy.textContent = old; }, 1200);
  });

  loadSelected();
  renderSelected();
  Promise.all([loadPresets(), loadSearch("")]).catch((err) => {
    els.status.innerHTML = `<span class="error">${esc(err.message)}</span>`;
  });
</script>
</body>
</html>
